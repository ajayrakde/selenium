<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trace Moving Button</title>
    <style>
      #moving {
        position: relative;
        animation: drift 1s linear infinite;
        padding: 12px 24px;
      }
      @keyframes drift {
        0% {
          transform: translateX(0);
        }
        50% {
          transform: translateX(80px);
        }
        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <button id="moving">Moving Button</button>
  </body>
</html>
